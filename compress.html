<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Compressor Pro - Pengecil Ukuran PDF</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- Reset & Variabel CSS (Sama persis dengan versi Fusion) --- */
        :root {
            --bg-color: #0a192f;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #e6f1ff;
            --primary-blue: #007bff;
            --accent-yellow: #ffc107;
            --card-bg: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 10%, rgba(0, 123, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(255, 193, 7, 0.08) 0px, transparent 50%);
            color: var(--text-color);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; position: relative;
        }

        .glass-container { 
            background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: 20px; border: 1px solid var(--glass-border); box-shadow: var(--shadow);
            padding: 40px; width: 100%; max-width: 600px; text-align: center; position: relative; overflow: hidden;
        }

        h2 { 
            font-weight: 700; font-size: 2rem; margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 0%, var(--accent-yellow) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .subtitle { font-size: 14px; color: #8892b0; margin-bottom: 30px; font-weight: 300; }
        .upload-section { margin-bottom: 30px; }

        .custom-file-upload {
            display: inline-block; padding: 15px 30px; cursor: pointer;
            background: rgba(255, 193, 7, 0.1); border: 2px dashed var(--accent-yellow);
            border-radius: 50px; color: var(--accent-yellow); font-weight: 600; font-size: 14px; transition: all 0.3s ease;
        }
        .custom-file-upload:hover { background: rgba(255, 193, 7, 0.2); transform: translateY(-2px); }
        input[type="file"] { display: none; }

        /* Tampilan File Terpilih */
        #fileList { list-style-type: none; margin: 20px 0; padding: 0; }
        .file-item { 
            background: var(--card-bg); border: 1px solid var(--glass-border); padding: 18px 25px; 
            border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 15px;
            animation: slideIn 0.4s forwards;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pdf-icon { font-size: 24px; color: var(--accent-yellow); }
        .file-name { font-weight: 600; color: var(--text-color); font-size: 14px; word-break: break-all; }
        .file-size { color: #8892b0; font-size: 12px; margin-left: 10px; }

        /* Tombol Aksi */
        #compressBtn { 
            background: linear-gradient(135deg, var(--primary-blue) 0%, #0056b3 100%);
            color: #fff; border: none; padding: 18px 30px; font-size: 16px; 
            border-radius: 50px; cursor: pointer; display: none; width: 100%;
            font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3); transition: all 0.3s ease;
        }
        #compressBtn:hover { box-shadow: 0 6px 20px rgba(0, 123, 255, 0.5); transform: translateY(-2px); }
        #compressBtn:disabled { background: #555; cursor: not-allowed; transform: none; box-shadow: none;}

        /* Layar Loading */
        #loadingOverlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 25, 47, 0.95); backdrop-filter: blur(5px);
            flex-direction: column; justify-content: center; align-items: center; z-index: 10;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid rgba(0, 123, 255, 0.3); border-radius: 50%;
            border-top-color: var(--primary-blue); animation: spin 1s ease-in-out infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #loadingText { color: var(--text-color); font-weight: 600; font-size: 16px; margin-bottom: 10px; }
        #loadingDetail { color: var(--accent-yellow); font-size: 13px; font-weight: 300; }
        #status { margin-top: 25px; font-size: 14px; font-weight: 400; min-height: 20px; }

        /* --- Tombol Saweria --- */
        .saweria-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid var(--accent-yellow);
            color: var(--accent-yellow);
            text-decoration: none;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .saweria-btn:hover {
            background: var(--accent-yellow);
            color: #000;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.3);
            transform: translateY(-2px);
        }

        /* Tanda Tangan */
        .author-signature { position: fixed; bottom: 20px; right: 30px; font-size: 11px; color: rgba(230, 241, 255, 0.4); text-align: right; display: flex; flex-direction: column; gap: 2px; }
        .author-signature span.crafted-text { color: rgba(230, 241, 255, 0.6); font-weight: 300; }
        .author-signature p.author-name { color: var(--primary-blue); font-weight: 600; text-transform: uppercase; text-shadow: 0 0 4px rgba(0, 123, 255, 0.5); }
    </style>
</head>
<body>

    <div class="glass-container">
        <div id="loadingOverlay">
            <div class="spinner"></div>
            <div id="loadingText">MENEKAN DOKUMEN...</div>
            <div id="loadingDetail">Mengekstrak dan mengompresi halaman</div>
        </div>

        <h2>PDF Compressor Pro</h2>
        <p class="subtitle">Perkecil ukuran PDF Anda secara drastis untuk keperluan unggah sistem.</p>
        
        <div class="upload-section">
            <label for="fileInput" class="custom-file-upload">
                + PILIH 1 DOKUMEN PDF
            </label>
            <input type="file" id="fileInput" accept="application/pdf">
        </div>

        <ul id="fileList"></ul>
        
        <button id="compressBtn" onclick="kompresPDF()">Kompres Menjadi Maksimal 1 MB</button>
        
        <p id="status"></p>

        <a href="https://saweria.co/irwanbahalap" target="_blank" class="saweria-btn">
            ☕ Traktir Kopi via Saweria
        </a>
    </div>

    <div class="author-signature">
        <span class="crafted-text">Crafted with Shrink Pro</span>
        <p class="author-name">by Irwan Setia Rahman</p>
    </div>

    <script>
        let fileAktif = null;

        // Fungsi format ukuran file
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Saat file dipilih
        document.getElementById('fileInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            const fileListElement = document.getElementById('fileList');
            document.getElementById('status').innerText = '';

            if (file) {
                fileAktif = file;
                fileListElement.innerHTML = `
                    <li class="file-item">
                        <span class="pdf-icon">📄</span>
                        <span class="file-name">${file.name}</span>
                        <span class="file-size">(${formatBytes(file.size)})</span>
                    </li>
                `;
                document.getElementById('compressBtn').style.display = 'block';
            }
        });

        // Jeda untuk UI
        function jeda(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        // Fungsi Kompresi
        async function kompresPDF() {
            if (!fileAktif) return;

            const overlay = document.getElementById('loadingOverlay');
            const loadingDetail = document.getElementById('loadingDetail');
            const statusBox = document.getElementById('status');
            
            overlay.style.display = 'flex';
            statusBox.innerText = "";
            document.getElementById('compressBtn').disabled = true;

            try {
                // 1. Baca PDF yang diunggah
                const arrayBuffer = await fileAktif.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                
                // 2. Siapkan PDF kosong baru (jsPDF)
                const { jsPDF } = window.jspdf;
                const pdfBaru = new jsPDF('p', 'mm', 'a4'); // Format A4 standar dokumen sekolah

                // Kunci Kompresi: Scale 1.5 untuk menjaga ketajaman, JPEG Quality 0.7 untuk menekan ke bawah 1MB
                const SCALE_RESOLUSI = 1.5; 
                const KUALITAS_KOMPRESI = 0.7;

                // 3. Loop setiap halaman
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    loadingDetail.innerText = `Mengompres Halaman ${pageNum} dari ${pdf.numPages}`;
                    await jeda(50); // Nafas untuk browser

                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: SCALE_RESOLUSI });

                    // Buat kanvas HTML di latar belakang
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    // Gambar halaman PDF ke atas kanvas
                    await page.render({ canvasContext: context, viewport: viewport }).promise;

                    // EKSEKUSI KOMPRESI: Ubah kanvas menjadi gambar JPEG yang dipadatkan
                    const imgData = canvas.toDataURL('image/jpeg', KUALITAS_KOMPRESI);

                    // Hitung dimensi agar pas di kertas A4
                    const pdfWidth = pdfBaru.internal.pageSize.getWidth();
                    const pdfHeight = (canvas.height * pdfWidth) / canvas.width;

                    // Masukkan ke PDF baru
                    if (pageNum > 1) pdfBaru.addPage();
                    pdfBaru.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                }

                loadingDetail.innerText = "Membungkus hasil akhir...";
                await jeda(200);

                // 4. Unduh hasilnya
                pdfBaru.save(`Kompres_${fileAktif.name}`);

                overlay.style.display = 'none';
                statusBox.innerText = "✅ Berhasil! Dokumen Anda berhasil disusutkan.";
                statusBox.style.color = "var(--accent-yellow)";

            } catch (error) {
                console.error(error);
                overlay.style.display = 'none';
                statusBox.innerHTML = `❌ <b>GAGAL:</b> Terjadi kesalahan pemrosesan.`;
                statusBox.style.color = "#ff4444";
            } finally {
                document.getElementById('compressBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
